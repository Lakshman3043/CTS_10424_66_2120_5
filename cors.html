<html>
    <body>
        <h1>CORS</h1>
        <div id="data"></div>
    </body>
    <script>
        // make xmlhttprequest with basic authentication to get products
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'http://localhost:8080/api/products', true);
        xhr.setRequestHeader('Authorization', 'Basic ' + btoa('john:pwd'));
        console.log(xhr.readyState);
        xhr.onreadystatechange = function() {
            console.log(xhr.readyState);
            if (xhr.readyState == 4 && xhr.status == 200) {
                document.getElementById('data').innerHTML = xhr.responseText;
            }
        }
        console.log("before send");
        xhr.send();
    </script>
</html>
